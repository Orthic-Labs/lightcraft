[package]
name = "lightcraft-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version = "1.98"
default-run = "lightcraft-desktop"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
qa-native = ["dep:rightkit-control"]

[lints]
workspace = true

[dependencies]
lightcraft-desktop-host = { workspace = true }
lightcraft-engine = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { workspace = true }
tauri = { version = "=2.12.1" }
rightkit-shell = { version = "=0.1.0", default-features = false }
rightkit-control = { version = "=0.1.6", features = ["tauri-plugin"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.build-dependencies]
tauri-build = "=2.7.1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dev-dependencies]
rightkit-qa = "=0.2.6"
lightcraft-tiff = { workspace = true }
png = { workspace = true }
