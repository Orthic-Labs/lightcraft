<!doctype html>
<html lang="en" data-theme="dark" data-platform="macos" data-view="library" data-frame="fill">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LightCraft · design refresh (Astra)</title>
<style>
/* ============================================================================
   LightCraft design refresh · Fable 5.1 · 2026-10-08
   Self-contained design simulation. No build, no network. Structure and tokens
   follow @rightkit/app-shell 0.2.1 shell.css (fused sidebar + titlebar on one
   chrome surface, concave 12px joins into the plane). LightCraft adds a right
   tool rail on the same chrome surface that fuses into the inspector.
   ========================================================================== */

/* ---- Inter: LightCraft's approved UI font (OFL, source/assets/ATTRIBUTION.md) ---- */
@font-face{font-family:"Inter";font-weight:400;src:url("../assets/fonts/Inter-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Inter";font-weight:500;src:url("../assets/fonts/Inter-Medium.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Inter";font-weight:600;src:url("../assets/fonts/Inter-SemiBold.ttf") format("truetype");font-display:swap}

/* ---- RightKit suite tokens (values verbatim from shell.css) + LightCraft brand ---- */
:root{
  --rk-brand:#0165dd; --rk-brand-dark:#4d9bff; --rk-wordmark-font:"Inter",sans-serif;
  --rk-sidebar-width:268px; --rk-titlebar-height:52px; --rk-lights-width:72px;
  --rk-chrome:#eee9df; --rk-plane:#fffcf5; --rk-elevated:#ffffff; --rk-panel:#ffffff; --rk-sunk:#f6f1e8;
  --rk-fill:rgba(35,31,26,.05); --rk-fill-2:rgba(35,31,26,.085); --rk-fill-3:rgba(35,31,26,.13);
  --rk-line:rgba(35,31,26,.11); --rk-line-strong:rgba(35,31,26,.18); --rk-hairline:rgba(35,31,26,.11);
  --rk-ink:#231f1a; --rk-ink-2:#6b655c; --rk-ink-3:#8a8378;
  --rk-accent:var(--rk-brand); --rk-accent-soft:color-mix(in srgb,var(--rk-accent) 14%,transparent); --rk-accent-ink:#ffffff;
  --rk-focus:#0165dd; /* LightCraft overrides RightKit's translucent ring with an opaque one (app.css) */
  --rk-ok:#1e7f3c; --rk-ok-dot:#2ba24a; --rk-ok-soft:rgba(43,162,74,.14);
  --rk-warn:#b25000; --rk-warn-dot:#e08a00; --rk-warn-soft:rgba(224,138,0,.14);
  --rk-bad:#c4001a; --rk-bad-soft:rgba(196,0,26,.1);
  --rk-radius:12px; --rk-card:0 0 0 .5px rgba(35,31,26,.09),0 1px 3px rgba(35,31,26,.06);
  --rk-knob:0 1px 2px rgba(35,31,26,.14),0 0 0 .5px rgba(35,31,26,.06);
  --rk-sel:rgba(35,31,26,.06); --rk-seg-on:#ffffff; --rk-ghost:#ffffff;
  --rk-pop:0 0 0 .5px var(--rk-line-strong),0 16px 40px rgba(20,16,10,.22); --rk-scrim:rgba(20,16,10,.38);
  --rk-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* LightCraft photo surfaces: neutral, never warm, so the photo is the only coloured thing on stage */
  --lc-stage:#4a4a4d; --lc-grid:#f3efe7; --lc-cell:#e6e1d8; --lc-strip:#efeae1;
  --lc-on-stage:#ececec; --lc-on-stage-2:#b9b9bd; --lc-star:#f0b429; --lc-pick:#4d9bff; --lc-reject:#ff6961;
  --lc-inspector:320px; --lc-rail:44px;
  --lc-label-red:#ef5d5d; --lc-label-yellow:#e9c65e; --lc-label-green:#65ca70; --lc-label-blue:#60a9f5; --lc-label-purple:#a677e8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --rk-chrome:#0f0f10; --rk-plane:#17171a; --rk-elevated:#1f1f23; --rk-panel:#1f1f23; --rk-sunk:#1c1c1f;
  --rk-fill:rgba(242,240,236,.055); --rk-fill-2:rgba(242,240,236,.09); --rk-fill-3:rgba(242,240,236,.14);
  --rk-line:rgba(242,240,236,.09); --rk-line-strong:rgba(242,240,236,.16); --rk-hairline:rgba(242,240,236,.09);
  --rk-ink:#f2f0ec; --rk-ink-2:#969390; --rk-ink-3:#6e6b68;
  --rk-accent:var(--rk-brand-dark); --rk-accent-soft:color-mix(in srgb,var(--rk-accent) 18%,transparent);
  --rk-focus:#4d9bff;
  --rk-ok:#4cd07d; --rk-ok-dot:#4cd07d; --rk-ok-soft:rgba(76,208,125,.16);
  --rk-warn:#ffb340; --rk-warn-dot:#ffb340; --rk-warn-soft:rgba(255,179,64,.16);
  --rk-bad:#ff6961; --rk-bad-soft:rgba(255,105,97,.12);
  --rk-card:0 0 0 .5px rgba(242,240,236,.08); --rk-knob:0 1px 2px rgba(0,0,0,.4);
  --rk-sel:rgba(242,240,236,.1); --rk-seg-on:#3a3a42; --rk-ghost:#2a2a30;
  --rk-pop:0 0 0 .5px var(--rk-line-strong),0 18px 44px rgba(0,0,0,.55); --rk-scrim:rgba(0,0,0,.55);
  --lc-stage:#1c1c1c; --lc-grid:#121214; --lc-cell:#232326; --lc-strip:#121214;
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --rk-chrome:#0f0f10; --rk-plane:#17171a; --rk-elevated:#1f1f23; --rk-panel:#1f1f23; --rk-sunk:#1c1c1f;
  --rk-fill:rgba(242,240,236,.055); --rk-fill-2:rgba(242,240,236,.09); --rk-fill-3:rgba(242,240,236,.14);
  --rk-line:rgba(242,240,236,.09); --rk-line-strong:rgba(242,240,236,.16); --rk-hairline:rgba(242,240,236,.09);
  --rk-ink:#f2f0ec; --rk-ink-2:#969390; --rk-ink-3:#6e6b68;
  --rk-accent:var(--rk-brand-dark); --rk-accent-soft:color-mix(in srgb,var(--rk-accent) 18%,transparent);
  --rk-focus:#4d9bff;
  --rk-ok:#4cd07d; --rk-ok-dot:#4cd07d; --rk-ok-soft:rgba(76,208,125,.16);
  --rk-warn:#ffb340; --rk-warn-dot:#ffb340; --rk-warn-soft:rgba(255,179,64,.16);
  --rk-bad:#ff6961; --rk-bad-soft:rgba(255,105,97,.12);
  --rk-card:0 0 0 .5px rgba(242,240,236,.08); --rk-knob:0 1px 2px rgba(0,0,0,.4);
  --rk-sel:rgba(242,240,236,.1); --rk-seg-on:#3a3a42; --rk-ghost:#2a2a30;
  --rk-pop:0 0 0 .5px var(--rk-line-strong),0 18px 44px rgba(0,0,0,.55); --rk-scrim:rgba(0,0,0,.55);
  --lc-stage:#1c1c1c; --lc-grid:#121214; --lc-cell:#232326; --lc-strip:#121214;
  color-scheme:dark;
}

/* ---- Page / harness (not part of the product) ---- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#8a8580;font:13px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#231f1a;-webkit-font-smoothing:antialiased;overflow:hidden}
:root[data-theme="dark"] body{background:#2a2a2d}
#harness{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:300;display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:999px;background:rgba(20,16,10,.8);color:#f2f0ec;font-size:11.5px;backdrop-filter:blur(10px);white-space:nowrap}
#harness button{font:inherit;color:inherit;background:rgba(255,255,255,.1);border:0;border-radius:999px;padding:3px 9px;cursor:default}
#harness button[aria-pressed="true"]{background:#fff;color:#231f1a}
#harness button:focus-visible{outline:2px solid #4d9bff;outline-offset:1px}
#harness .sep{width:1px;height:14px;background:rgba(255,255,255,.25)}
#harness span.lbl{opacity:.7;margin-left:4px}
#stage{position:absolute;inset:0;display:block}
#win{width:100%;height:100%;position:relative;overflow:hidden}
:root[data-frame="fixed"] #stage{display:grid;place-items:center}
:root[data-frame="fixed"] #win{width:var(--frame-w,1600px);height:var(--frame-h,1000px);border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 30px 80px rgba(0,0,0,.35)}
:root[data-frame="fixed"][data-platform="windows"] #win{border-radius:8px}

/* ---- Shell frame (mirrors .rk-shell > .rk-top + .rk-body > .rk-side + .rk-plane; LightCraft adds .lc-rail) ---- */
.rk-shell,.rk-shell *,.rk-shell *::before,.rk-shell *::after{box-sizing:border-box}
.rk-shell{display:flex;flex-direction:column;height:100%;background:var(--rk-chrome);color:var(--rk-ink);font:13px/1.4 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;letter-spacing:-.003em;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
:where(.rk-shell) button{font:inherit;color:inherit;cursor:default;background:none;border:0;padding:0;margin:0;text-align:inherit}
.rk-shell input,.rk-shell textarea{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
.rk-shell :focus{outline:none}
.rk-shell :focus-visible{outline:2px solid var(--rk-focus);outline-offset:2px;box-shadow:0 0 0 4px var(--rk-plane)}
.rk-shell .rk-item:focus-visible,.rk-shell .rk-seg__item:focus-visible,.rk-shell .rk-icon-btn:focus-visible{outline-offset:-2px;box-shadow:none}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg.ic{width:16px;height:16px;flex:none;display:block}
kbd{font:inherit;font-size:11px;color:var(--rk-ink-3)}
.rk-kbd{display:inline-flex;gap:2px}
.rk-kbd span{min-width:18px;padding:2px 5px;border-radius:5px;background:var(--rk-fill-2);color:var(--rk-ink-2);font:11px/1 var(--rk-font-mono);text-align:center;box-shadow:inset 0 -1px 0 var(--rk-line)}

/* Titlebar */
.rk-top{display:flex;align-items:center;gap:10px;height:var(--rk-titlebar-height);padding:0 14px 0 0;background:var(--rk-chrome);flex:none}
.rk-top__side{display:flex;align-items:center;width:var(--rk-sidebar-width);flex:none;height:100%;padding:0 14px 0 16px;gap:4px;transition:width .18s}
.rk-shell.is-collapsed .rk-top__side{width:auto;padding-right:6px}
.rk-top__lights{width:var(--rk-lights-width);height:100%;flex:none;display:none;align-items:center;gap:8px}
:root[data-platform="macos"] .rk-top__lights{display:flex}
.rk-top__lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.rk-top__lights i:nth-child(1){background:#ff5f57}.rk-top__lights i:nth-child(2){background:#febc2e}.rk-top__lights i:nth-child(3){background:#28c840}
.rk-top__title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.rk-top__drag{flex:1;align-self:stretch}
.rk-top__end{display:flex;align-items:center;gap:8px;min-width:0}
.rk-caption{display:none;align-self:stretch;margin-right:-14px;margin-left:6px}
:root[data-platform="windows"] .rk-caption{display:flex}
.rk-caption__btn{width:46px;color:var(--rk-ink-2);display:flex;align-items:center;justify-content:center}
.rk-caption__btn:hover{background:var(--rk-fill-2);color:var(--rk-ink)}
.rk-caption__close:hover{background:#c42b1c;color:#fff}

/* UI kit (RightKit classes) */
.rk-icon-btn{width:28px;height:28px;flex:none;border-radius:7px;display:grid;place-items:center;color:var(--rk-ink-2);transition:background-color .12s,color .12s;position:relative}
.rk-icon-btn:hover,.rk-icon-btn.is-open,.rk-icon-btn[aria-pressed="true"]{background:var(--rk-fill-2);color:var(--rk-ink)}
.rk-icon-btn:disabled{opacity:.4}
.rk-seg{display:inline-flex;padding:2px;gap:2px;border-radius:9px;background:var(--rk-fill-2)}
.rk-seg__item{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:7px;color:var(--rk-ink-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.rk-seg__item[aria-checked="true"],.rk-seg__item[aria-pressed="true"]{background:var(--rk-seg-on);color:var(--rk-ink);box-shadow:var(--rk-knob)}
.rk-seg--icons .rk-seg__item{padding:4px 7px}
.rk-seg--lg .rk-seg__item{padding:5px 14px;font-size:13px;font-weight:600}
.rk-seg__item kbd{color:var(--rk-ink-3)}
.rk-seg__item[aria-checked="true"] kbd{color:var(--rk-ink-2)}
.rk-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:0 12px;border-radius:8px;font-weight:500;white-space:nowrap;transition:background-color .12s,transform .1s}
.rk-btn--sm{min-height:24px;padding:0 9px;font-size:12px;border-radius:6px}
.rk-btn:active{transform:scale(.97)}
.rk-btn:disabled{opacity:.5;pointer-events:none}
.rk-btn--primary{background:var(--rk-accent);color:var(--rk-accent-ink)}
.rk-btn--primary:hover{background:color-mix(in srgb,var(--rk-accent) 88%,black)}
.rk-btn--secondary{background:var(--rk-fill-2);color:var(--rk-ink)}
.rk-btn--secondary:hover{background:var(--rk-fill-3)}
.rk-btn--ghost{box-shadow:inset 0 0 0 1px var(--rk-line-strong)}
.rk-btn--ghost:hover{background:var(--rk-fill)}
.rk-btn--danger{background:var(--rk-bad);color:#fff}
.rk-input{height:30px;padding:0 10px;border:0;border-radius:8px;background:var(--rk-fill-2);color:var(--rk-ink);font:inherit;outline:none;min-width:0}
.rk-input:focus{background:var(--rk-elevated);box-shadow:0 0 0 2px var(--rk-focus)}
.rk-input::placeholder{color:var(--rk-ink-3)}
.rk-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;background:var(--rk-fill-2);font-size:11.5px;color:var(--rk-ink-2);white-space:nowrap}
.rk-pill--warn{background:var(--rk-warn-soft);color:var(--rk-warn)}
.rk-pill--accent{background:var(--rk-accent-soft);color:var(--rk-accent)}
.rk-pill--bad{background:var(--rk-bad-soft);color:var(--rk-bad)}
.rk-pill button{margin-right:-6px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:inherit}
.rk-pill button:hover{background:var(--rk-fill-3)}
.rk-badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--rk-fill-2);color:var(--rk-ink-2);white-space:nowrap}
.rk-badge--warn{background:var(--rk-warn-soft);color:var(--rk-warn)}
.rk-badge--ok{background:var(--rk-ok-soft);color:var(--rk-ok)}
.rk-badge--accent{background:var(--rk-accent-soft);color:var(--rk-accent)}
.rk-toggle{position:relative;width:36px;height:22px;border-radius:99px;background:var(--rk-fill-3);transition:background-color .15s;flex:none}
.rk-toggle[aria-checked="true"]{background:var(--rk-accent)}
.rk-toggle__knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--rk-knob);transition:transform .15s}
.rk-toggle[aria-checked="true"] .rk-toggle__knob{transform:translateX(14px)}
.rk-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 24px;text-align:center;color:var(--rk-ink-2)}
.rk-empty strong{color:var(--rk-ink);font-size:15px}
.rk-empty p{margin:0;max-width:42ch;text-wrap:pretty}
.rk-empty__icon{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--rk-fill-2);color:var(--rk-accent)}
.rk-empty__icon svg{width:18px;height:18px}
.rk-status{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--rk-ink-2);padding:10px 18px}
.rk-status__row{display:flex;justify-content:space-between;gap:8px}
.rk-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--rk-ink-3)}
.rk-dot--ok{background:var(--rk-ok-dot)}.rk-dot--warn{background:var(--rk-warn-dot)}.rk-dot--bad{background:var(--rk-bad)}.rk-dot--accent{background:var(--rk-accent)}

/* Body: sidebar + plane + right rail */
.rk-body{flex:1;min-height:0;display:flex}
.rk-side{background:var(--rk-chrome);width:var(--rk-sidebar-width);flex:none;display:flex;flex-direction:column;min-height:0;transition:width .18s}
.rk-shell.is-collapsed .rk-side{width:48px}
.rk-plane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--rk-plane);border-top-left-radius:20px;overflow:hidden;position:relative}
.rk-search{margin:8px 10px 6px;display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:7px;background:var(--rk-fill-2);color:var(--rk-ink-3);font-size:13px;flex:none;width:calc(100% - 20px);text-align:left}
.rk-search:hover{background:var(--rk-fill-3)}
.rk-search svg{width:14px;height:14px;flex:none}
.rk-search__text{flex:1;min-width:0;color:var(--rk-ink-3)}
.rk-shell.is-collapsed .rk-search{width:28px;margin-inline:10px;padding:0 7px}
.rk-shell.is-collapsed .rk-search__text,.rk-shell.is-collapsed .rk-search .rk-kbd{display:none}
.rk-nav{overflow-y:auto;overflow-x:hidden;padding:0 0 14px;flex:1;scrollbar-width:thin}
.rk-group{margin-top:12px}
.rk-group__head{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 16px);margin:0 8px 2px;padding:0 10px;height:24px;font-size:11px;font-weight:600;color:var(--rk-ink-3);border-radius:6px;text-transform:uppercase;letter-spacing:.06em}
.rk-group__head:hover{color:var(--rk-ink);background:var(--rk-fill)}
.rk-group__head svg{width:12px;height:12px;transition:transform .12s}
.rk-group__head[aria-expanded="false"] svg{transform:rotate(-90deg)}
.rk-group__head[aria-expanded="false"]+div{display:none}
.rk-shell.is-collapsed .rk-group__head{display:none}
.rk-item{position:relative;display:flex;align-items:center;gap:8px;width:calc(100% - 16px);height:30px;margin:0 8px;padding:0 8px 0 10px;border-radius:8px;color:var(--rk-ink);text-align:left;font-size:13px;transition:background-color .12s}
.rk-item:hover{background:var(--rk-fill)}
.rk-item>svg:not(.rk-fuse){width:16px;height:16px;flex:none;color:var(--rk-accent)}
.rk-item__label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-item__badge{margin-left:auto;font-size:11px;color:var(--rk-ink-3);display:inline-flex;align-items:center}
.rk-item.is-active{z-index:1;width:calc(100% - 8px);margin-right:0;border-radius:12px 0 0 12px;background:var(--rk-plane)}
.rk-item.is-active:hover{background:var(--rk-plane)}
.rk-fuse{position:absolute;right:0;width:12px;height:12px;fill:var(--rk-fuse-fill,var(--rk-plane));color:initial;pointer-events:none}
.rk-fuse--top{top:-12px}.rk-fuse--bottom{bottom:-12px;transform:scaleY(-1)}
.rk-shell.is-collapsed .rk-item{width:40px;margin:0 4px;padding:0;justify-content:center}
.rk-shell.is-collapsed .rk-item.is-active{width:44px;margin-right:0;border-radius:10px 0 0 10px;padding-left:4px}
.rk-shell.is-collapsed .rk-item__label,.rk-shell.is-collapsed .rk-item__badge{display:none}
.rk-shell.is-collapsed .rk-group{margin-top:6px}
.rk-side__foot{display:flex;flex-direction:column;flex:none}
.rk-shell.is-collapsed .rk-status{display:none}
.rk-brand-foot{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 16px;border-top:.5px solid var(--rk-hairline)}
.rk-shell.is-collapsed .rk-brand-foot{padding:0;justify-content:center}
.rk-shell.is-collapsed .rk-wordmark{display:none}
.rk-wordmark{margin-right:auto;font:600 17px/1 var(--rk-wordmark-font,inherit);letter-spacing:-.03em;color:var(--rk-ink);white-space:nowrap}
.rk-wordmark span{color:var(--rk-accent)}

/* Right tool rail: same chrome surface as the sidebar; the active tool fuses into the inspector */
.lc-rail{width:var(--lc-rail);flex:none;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:10px 0 8px;background:var(--rk-chrome);position:relative}
.lc-rail__btn{position:relative;display:grid;place-items:center;height:36px;margin:0 4px;border-radius:8px;color:var(--rk-ink-2)}
.lc-rail__btn:hover{background:var(--rk-fill);color:var(--rk-ink)}
.lc-rail__btn svg{width:18px;height:18px}
.lc-rail__btn[aria-pressed="true"]{color:var(--rk-accent);background:var(--rk-plane);margin-left:0;border-radius:0 10px 10px 0;z-index:1}
.lc-rail__btn[aria-pressed="true"]:hover{background:var(--rk-plane)}
.lc-rail__btn .rk-fuse{right:auto;left:0;transform:scaleX(-1)}
.lc-rail__btn .rk-fuse--bottom{transform:scale(-1,-1)}
.lc-rail__gap{height:10px}
.lc-rail__spacer{flex:1}
.lc-rail__btn .tip{position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--rk-ink);color:var(--rk-plane);font-size:11.5px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;display:flex;gap:8px;align-items:center;z-index:50}
.lc-rail__btn .tip kbd{color:var(--rk-plane);opacity:.6}
.lc-rail__btn:hover .tip,.lc-rail__btn:focus-visible .tip{opacity:1;transition-delay:.35s}
/* when the inspector is collapsed the active tool fuses into nothing: keep it a quiet pill */
.rk-shell.inspector-hidden .lc-rail__btn[aria-pressed="true"]{background:var(--rk-accent-soft);margin-right:4px;border-radius:8px}
.rk-shell.inspector-hidden .lc-rail__btn .rk-fuse{display:none}

/* ---- Workspace inside the plane ---- */
.lc-work{flex:1;min-height:0;display:flex}
.lc-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.lc-inspector{width:var(--lc-inspector);flex:none;display:flex;flex-direction:column;min-height:0;border-left:.5px solid var(--rk-hairline);background:var(--rk-plane);position:relative}
.rk-shell.inspector-hidden .lc-inspector{display:none}
.lc-inspector__grip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3}
.lc-inspector__grip:hover,.lc-inspector__grip.is-dragging{background:linear-gradient(90deg,transparent 3px,var(--rk-accent) 3px,var(--rk-accent) 5px,transparent 5px)}
.lc-inspector__grip:focus-visible{outline:2px solid var(--rk-focus);outline-offset:-2px;box-shadow:none}
.lc-inspector__scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-bottom:24px}
.lc-panel-head{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px 6px 16px}
.lc-panel-head h2{margin:0;font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-panel-head small{color:var(--rk-ink-3);font-size:11.5px}

/* ---- Library header: source title + tools, then search + chips ---- */
.lc-lib-head{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 14px 6px 20px;flex-wrap:wrap}
.lc-lib-head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lc-lib-head .count{color:var(--rk-ink-2);font-size:12.5px;white-space:nowrap}
.lc-lib-head .count b{font-weight:500;color:var(--rk-accent)}
.lc-lib-head .grow{flex:1}
.lc-lib-tools{display:flex;align-items:center;gap:8px}
.lc-thumbsize{display:flex;align-items:center;gap:6px;color:var(--rk-ink-3)}
.lc-thumbsize input{width:96px;accent-color:var(--rk-accent)}
.lc-filterbar{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px 8px 20px;flex-wrap:wrap}
.lc-filterbar .rk-search{margin:0;width:220px;flex:none;background:var(--rk-fill-2)}
.lc-filterbar .rk-search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--rk-ink)}
.lc-filterbar .rk-search:focus-within{background:var(--rk-elevated);box-shadow:0 0 0 2px var(--rk-focus)}
.lc-chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:99px;background:var(--rk-fill);color:var(--rk-ink-2);font-size:12px;font-weight:500;white-space:nowrap}
.lc-chip:hover{background:var(--rk-fill-2);color:var(--rk-ink)}
.lc-chip[aria-pressed="true"]{background:var(--rk-accent-soft);color:var(--rk-accent)}
.lc-chip svg{width:13px;height:13px}
.lc-chip--clear{background:none;color:var(--rk-accent)}
.lc-chip--clear:hover{background:var(--rk-accent-soft);color:var(--rk-accent)}
.lc-filterbar .sep{width:1px;height:16px;background:var(--rk-hairline);margin:0 4px}

/* Grid */
.lc-grid-wrap{flex:1;min-height:0;position:relative;background:var(--lc-grid);border-top:.5px solid var(--rk-hairline)}
.lc-grid{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 24px;scrollbar-width:thin}
.lc-grid:focus-visible{outline:2px solid var(--rk-focus);outline-offset:-3px;box-shadow:none}
.lc-row{display:flex;gap:8px;margin-bottom:8px}
.lc-grid.is-square{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb,200px),1fr));gap:8px;align-content:start}
.lc-cell{position:relative;flex:none;border-radius:6px;background:var(--lc-cell);overflow:hidden;cursor:default;outline-offset:0}
.lc-grid.is-square .lc-cell{aspect-ratio:1;width:auto}
.lc-cell .ph{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.lc-cell::after{content:"";position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);pointer-events:none}
.lc-cell:hover::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.lc-cell.is-selected::after{box-shadow:inset 0 0 0 2px var(--rk-accent)}
.lc-cell.is-active::after{box-shadow:inset 0 0 0 2px var(--rk-accent),inset 0 0 0 4px rgba(255,255,255,.85)}
.lc-cell:focus-visible{outline:2px solid var(--rk-focus);outline-offset:2px;box-shadow:none}
.lc-cell .top{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:4px;align-items:center;z-index:2}
.lc-cell .bot{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;display:flex;align-items:flex-end;gap:6px;color:#fff;font-size:11px;z-index:2;transition:background .12s}
.lc-cell:hover .bot,.lc-cell.is-selected .bot,.lc-grid.show-names .lc-cell .bot{background:linear-gradient(180deg,transparent,rgba(0,0,0,.55))}
.lc-cell .bot .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0;transition:opacity .12s;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.lc-cell:hover .bot .name,.lc-cell.is-selected .bot .name,.lc-grid.show-names .lc-cell .bot .name{opacity:.95}
.lc-cell .stars{display:inline-flex;gap:1px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.lc-cell .stars svg{width:11px;height:11px}
.lc-cell .stars .off{opacity:.35}
.lc-cell .stars.is-empty{opacity:0}
.lc-cell:hover .stars.is-empty,.lc-cell.is-selected .stars.is-empty{opacity:.6}
.lc-mark{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px)}
.lc-mark svg{width:11px;height:11px}
.lc-mark--pick{color:var(--lc-pick)}.lc-mark--reject{color:var(--lc-reject)}.lc-mark--edited{color:#ffd36e}
.lc-mark--label{width:10px;height:10px;background:var(--c);box-shadow:0 0 0 1.5px rgba(0,0,0,.45)}
.lc-mark--missing{width:auto;padding:0 7px;border-radius:99px;background:var(--rk-warn-dot);color:#231f1a;font-size:10px;font-weight:600;gap:4px}
.lc-mark--missing svg{width:10px;height:10px}
.lc-cell.is-missing .ph{filter:grayscale(.6) brightness(.8)}
.lc-cell.is-reject .ph{filter:brightness(.55) saturate(.7)}
.lc-cell.is-pending .ph{display:none}
.lc-cell.is-pending{background:linear-gradient(100deg,var(--lc-cell) 30%,color-mix(in srgb,var(--lc-cell) 70%,var(--rk-ink)) 50%,var(--lc-cell) 70%);background-size:300% 100%;animation:lc-shimmer 1.6s linear infinite}
.lc-cell.is-pending .pend{position:absolute;left:8px;bottom:6px;font-size:10.5px;color:var(--rk-ink-2)}
@keyframes lc-shimmer{to{background-position:-300% 0}}
.lc-grid-state{position:absolute;inset:0;display:grid;place-items:center;padding:40px}
.lc-grid-state .rk-empty{background:var(--rk-plane);border-radius:14px;box-shadow:var(--rk-card);padding:30px 34px}
.lc-banner{display:flex;align-items:center;gap:10px;margin:8px 14px 0 20px;padding:8px 10px 8px 12px;border-radius:10px;background:var(--rk-warn-soft);color:var(--rk-ink);font-size:12.5px}
.lc-banner svg{color:var(--rk-warn);width:16px;height:16px;flex:none}
.lc-banner .grow{flex:1}
.lc-banner--bad{background:var(--rk-bad-soft)}.lc-banner--bad svg{color:var(--rk-bad)}

/* Library Info panel bits */
.lc-preview{margin:0 14px 10px 16px;border-radius:10px;overflow:hidden;background:var(--lc-stage);position:relative;aspect-ratio:3/2;display:grid;place-items:center}
.lc-preview .ph{width:100%;height:100%;background-size:contain;background-repeat:no-repeat;background-position:center}
.lc-preview .lc-preview-empty{color:var(--lc-on-stage-2);font-size:12px}
.lc-field-row{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 16px;min-height:32px}
.lc-field-row>label,.lc-field-row>.lbl{width:84px;flex:none;color:var(--rk-ink-2);font-size:12px}
.lc-field-row .rk-input{flex:1;height:28px}
.lc-field-row .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-stars{display:inline-flex;gap:2px}
.lc-stars button{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--rk-ink-3)}
.lc-stars button:hover{background:var(--rk-fill-2)}
.lc-stars button.on{color:var(--lc-star)}
.lc-stars svg{width:15px;height:15px}
.lc-labels{display:inline-flex;gap:6px;align-items:center}
.lc-labels button{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.lc-labels button.none{background:none;box-shadow:inset 0 0 0 1.5px var(--rk-ink-3)}
.lc-labels button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--rk-plane),0 0 0 3.5px var(--rk-ink)}
.lc-chips{display:flex;flex-wrap:wrap;gap:5px;padding:4px 14px 8px 16px}
.lc-chips .chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:99px;background:var(--rk-fill-2);font-size:12px}
.lc-chips .chip button{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:var(--rk-ink-3);margin-right:-3px}
.lc-chips .chip button:hover{background:var(--rk-fill-3);color:var(--rk-ink)}
.lc-chips .chip svg{width:10px;height:10px}
.lc-meta{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px 8px;padding:6px 14px 10px 16px;font-size:12.5px}
.lc-meta dt{color:var(--rk-ink-2)}.lc-meta dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.lc-sub{margin:10px 14px 4px 16px;font-size:11px;font-weight:600;color:var(--rk-ink-3);text-transform:uppercase;letter-spacing:.06em}
.lc-actions{display:flex;gap:6px;padding:6px 14px 8px 16px;flex-wrap:wrap}

/* ---- Develop: stage ---- */
.lc-stage{flex:1;min-height:0;position:relative;background:var(--lc-stage);color:var(--lc-on-stage);display:flex;flex-direction:column}
.lc-stage__canvas{flex:1;min-height:0;position:relative;overflow:hidden;display:grid;place-items:center;padding:20px}
.lc-stage__canvas.is-grab{cursor:grab}.lc-stage__canvas.is-grabbing{cursor:grabbing}
.lc-photo{position:relative;width:var(--w);height:var(--h);box-shadow:0 2px 14px rgba(0,0,0,.45);background:#000;transform:translate(var(--px,0px),var(--py,0px));transition:width .15s,height .15s}
.lc-photo.no-anim{transition:none}
.lc-photo .ph{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;filter:var(--f,none)}
.lc-photo .ph.draft{filter:var(--f,none)}
.lc-photo .tint{position:absolute;inset:0;mix-blend-mode:soft-light;background:var(--tint,transparent);pointer-events:none}
.lc-photo .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent var(--vig-mid,50%),var(--vig-col,transparent) 130%)}
.lc-photo .grain{position:absolute;inset:0;pointer-events:none;opacity:var(--grain,0);mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* clipping overlay: measured per pixel from the decoded preview (canvas); hidden when pixels are not readable */
.lc-photo .clip{position:absolute;inset:0;pointer-events:none;display:none;background-size:100% 100%;image-rendering:pixelated}
.lc-stage.is-clipping .lc-photo .clip.has-data{display:block}
.lc-photo .mask-ov{position:absolute;inset:0;pointer-events:none;display:none}
.lc-stage.show-mask .lc-photo .mask-ov{display:block}
.lc-photo .spot{position:absolute;width:var(--r);height:var(--r);transform:translate(-50%,-50%);border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5);pointer-events:none}
.lc-photo .spot.src{border-style:dashed;opacity:.8}
.lc-pane-label{position:absolute;left:10px;bottom:10px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;backdrop-filter:blur(4px)}
.lc-stage__hud{position:absolute;top:12px;left:16px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none;z-index:4}
.lc-hud{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:99px;background:rgba(0,0,0,.5);color:#fff;font-size:11.5px;backdrop-filter:blur(6px);pointer-events:auto;white-space:nowrap;max-width:100%}
.lc-hud strong{font-weight:500}
.lc-hud .dim{opacity:.6}
.lc-hud .sep{width:1px;height:12px;background:rgba(255,255,255,.25)}
.lc-hud.status{gap:7px}
.lc-hud .spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:lc-spin .8s linear infinite}
@keyframes lc-spin{to{transform:rotate(360deg)}}
.lc-hud.saved{color:#bfe8c9}.lc-hud.warn{background:rgba(224,138,0,.85);color:#1b1206}
.lc-stage-empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--lc-on-stage-2);text-align:center}
.lc-stage-empty strong{color:var(--lc-on-stage);font-size:15px}
.lc-stage-empty .rk-btn{margin-top:6px}
.lc-crop{position:absolute;left:var(--x);top:var(--y);width:var(--cw);height:var(--ch);box-shadow:0 0 0 100vmax rgba(0,0,0,.55);outline:1px solid rgba(255,255,255,.9);z-index:3}
.lc-crop i{position:absolute;background:rgba(255,255,255,.45);pointer-events:none}
.lc-crop .v1{left:33.33%;top:0;bottom:0;width:1px}.lc-crop .v2{left:66.66%;top:0;bottom:0;width:1px}.lc-crop .h1{top:33.33%;left:0;right:0;height:1px}.lc-crop .h2{top:66.66%;left:0;right:0;height:1px}
.lc-crop .hd{position:absolute;width:14px;height:14px;background:#fff;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.5);touch-action:none}
.lc-crop .nw{left:-7px;top:-7px;cursor:nwse-resize}.lc-crop .ne{right:-7px;top:-7px;cursor:nesw-resize}.lc-crop .sw{left:-7px;bottom:-7px;cursor:nesw-resize}.lc-crop .se{right:-7px;bottom:-7px;cursor:nwse-resize}
.lc-crop .hd:focus-visible{outline:2px solid var(--rk-focus);outline-offset:2px;box-shadow:none}
.lc-navigator{position:absolute;right:16px;top:48px;width:160px;padding:6px;border-radius:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:5}
.lc-navigator .ph{width:100%;aspect-ratio:var(--a,1.5);background-size:100% 100%;border-radius:3px;position:relative;overflow:hidden}
.lc-navigator .box{position:absolute;border:1.5px solid var(--rk-brand-dark);background:rgba(77,155,255,.18);left:var(--nx);top:var(--ny);width:var(--nw);height:var(--nh)}
.lc-navigator small{display:block;color:#fff;opacity:.7;font-size:10.5px;margin:4px 2px 0}
.lc-stage__bar{flex:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px 0 12px;background:color-mix(in srgb,var(--lc-stage) 85%,black);border-top:.5px solid rgba(255,255,255,.07);color:var(--lc-on-stage);flex-wrap:wrap}
.lc-stage__bar .grow{flex:1}
.lc-stage__bar .rk-seg{background:rgba(255,255,255,.08)}
.lc-stage__bar .rk-seg__item{color:var(--lc-on-stage-2)}
.lc-stage__bar .rk-seg__item[aria-checked="true"]{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.lc-stage__bar .rk-icon-btn{color:var(--lc-on-stage-2)}
.lc-stage__bar .rk-icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.lc-stage__bar .rk-icon-btn[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#fff}
.lc-stage__bar .tbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:7px;color:var(--lc-on-stage-2);font-size:12px;white-space:nowrap}
.lc-stage__bar .tbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.lc-stage__bar .tbtn[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#fff}
.lc-stage__bar .tbtn kbd{color:var(--lc-on-stage-2);opacity:.7}
.lc-stage__bar .tbtn svg{width:15px;height:15px}
.lc-stage__bar .sep{width:1px;height:18px;background:rgba(255,255,255,.12);margin:0 2px}
.lc-rating-pill{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.08)}
.lc-rating-pill button{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:var(--lc-on-stage-2)}
.lc-rating-pill button:hover{background:rgba(255,255,255,.14);color:#fff}
.lc-rating-pill button.on{color:var(--lc-star)}
.lc-rating-pill button.pick.on{color:var(--lc-pick)}.lc-rating-pill button.reject.on{color:var(--lc-reject)}
.lc-rating-pill .sep{height:14px}
.lc-rating-pill svg{width:14px;height:14px}
.lc-zoom{display:inline-flex;align-items:center;gap:4px}
.lc-zoom select{appearance:none;background:rgba(255,255,255,.08);border:0;border-radius:7px;color:#fff;font:inherit;font-size:12px;height:28px;padding:0 24px 0 9px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%23fff' stroke-width='1.4' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
.lc-zoom select:focus-visible{outline:2px solid var(--rk-brand-dark);outline-offset:1px;box-shadow:none}

/* Astra pass: compact source context, clearer hierarchy, quieter tool rail. */
:root{--rk-sidebar-width:246px;--lc-inspector:292px;--lc-rail:50px}
.rk-top{gap:12px;padding-right:16px}
.rk-top__title{gap:12px}
.lc-lib-head{padding-inline:22px 18px}
.lc-filterbar{padding-inline:22px 18px}
.lc-grid-wrap{padding-inline:14px 18px}
.lc-grid{gap:10px}
.lc-row{gap:10px;margin-bottom:10px}
.lc-cell{border-radius:10px}
.lc-cell.is-active{box-shadow:inset 0 0 0 2px var(--rk-accent),inset 0 0 0 3px rgba(255,255,255,.82),0 8px 18px rgba(0,0,0,.16)}
.lc-cell .bot{padding:22px 9px 8px}
.lc-strip__ctx{height:34px;padding-inline:14px}
.lc-strip{height:108px}
.lc-strip__ctx .ctx{background:var(--rk-accent-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rk-accent) 28%,transparent)}
.lc-stage__canvas{padding:24px}
.lc-stage__bar{min-height:44px;padding-inline:14px}
.lc-panel-head{min-height:52px;padding:10px 16px 8px 18px;border-bottom:.5px solid var(--rk-hairline)}
.lc-panel-head h2{font-size:14px;letter-spacing:-.01em}
.lc-section>summary{min-height:42px;padding-inline:14px 16px}
.lc-section__body{padding-bottom:10px}
.lc-ctl{padding-inline:18px 16px}
.lc-ctl .lbl{color:color-mix(in srgb,var(--rk-ink-2) 90%,var(--rk-ink))}
.lc-rail{gap:4px;padding:14px 0 10px}
.lc-rail__btn{height:40px;margin-inline:5px}
.lc-rail__btn[aria-pressed="true"]{border-left:2px solid var(--rk-accent)}
.lc-rail__gap{height:12px}
.lc-rail__btn[data-tool="more"]{margin-top:2px;color:var(--rk-ink-3)}
.lc-rail__btn[data-tool="more"] .tip{right:calc(100% + 10px)}
.lc-rail__btn[data-tool="more"] svg{width:17px;height:17px}
#compact-source{display:none;flex:none;margin:6px 6px 2px;padding:4px 0;border-bottom:.5px solid var(--rk-hairline)}
#compact-source button{display:flex;align-items:center;gap:7px;width:100%;height:34px;padding:0 7px;border-radius:8px;color:var(--rk-ink-2);font-size:11px;white-space:nowrap;overflow:hidden}
#compact-source button:hover{background:var(--rk-fill-2);color:var(--rk-ink)}
#compact-source svg{width:15px;height:15px;color:var(--rk-accent);flex:none}
#compact-source .compact-source__text{overflow:hidden;text-overflow:ellipsis}
.rk-shell.is-collapsed #compact-source{display:block}
.rk-shell.is-collapsed #nav .rk-group{display:none}
.rk-shell.is-collapsed #sidebar .rk-search{margin-bottom:4px}
.rk-shell.is-collapsed .rk-brand-foot{border-top:0}
@media (max-width:1150px){
  :root{--rk-sidebar-width:226px;--lc-inspector:276px;--lc-rail:46px}
  .lc-lib-head{padding-inline:16px 12px}
  .lc-filterbar{padding-inline:16px 12px}
  .lc-grid-wrap{padding-inline:10px 12px}
  .lc-stage__canvas{padding:16px}
  .lc-stage__bar{gap:5px;padding-inline:8px}
  .lc-stage__bar .tbtn{padding-inline:7px}
}

/* Final cascade: keep compact stage controls on one stable row at 1280px. */
:root[data-theme="dark"]{--rk-ink-2:#aaa7a4;--rk-ink-3:#85817e;--lc-on-stage-2:#c7c7ca}
.lc-strip{height:108px}
.lc-stage__bar{flex-wrap:nowrap;overflow:hidden;min-width:0}
.lc-stage__bar .grow{min-width:2px}
.lc-stage__bar .lc-rating-pill,.lc-stage__bar #btn-film,.lc-stage__bar .lc-zoom{flex:none}
.lc-stage__bar .lc-zoom select{width:70px}
#compact-source{display:none!important}
@media (max-width:1300px){
  .lc-stage__bar{gap:4px;padding-inline:8px}
  .lc-stage__bar .tbtn{width:30px;padding:0;justify-content:center;font-size:0;gap:0}
  .lc-stage__bar .tbtn svg{width:15px;height:15px}
  .lc-stage__bar .tbtn kbd{display:none}
  .lc-stage__bar .rk-seg--icons .rk-seg__item{padding-inline:5px}
  .lc-stage__bar .lc-rating-pill{padding-inline:3px}
  .lc-stage__bar .lc-rating-pill button{width:20px}
}

/* Base filmstrip rules follow earlier explorations; repeat final height after them. */
.lc-strip{height:108px}
.lc-strip__ctx{height:34px;padding-inline:14px}

/* Filmstrip */
.lc-strip{flex:none;height:104px;display:flex;flex-direction:column;background:var(--lc-strip);border-top:.5px solid var(--rk-hairline);position:relative}
.lc-strip.is-collapsed{height:30px}
.lc-strip__ctx{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 12px;flex:none}
.lc-strip__ctx .ctx{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 7px;border-radius:99px;background:var(--rk-fill-2);color:var(--rk-ink);font-size:11.5px;font-weight:500;white-space:nowrap}
.lc-strip__ctx .ctx svg{width:12px;height:12px;color:var(--rk-accent)}
.lc-strip__ctx .ctx:hover{background:var(--rk-fill-3)}
.lc-strip__ctx .ctx .f{color:var(--rk-accent)}
.lc-strip__ctx .pos{color:var(--rk-ink-3);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lc-strip__ctx .grow{flex:1}
.lc-strip__ctx .rk-icon-btn{width:24px;height:24px}
.lc-strip__scroll{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:0 12px 8px;display:flex;gap:6px;align-items:flex-start;scroll-behavior:smooth}
.lc-strip.is-collapsed .lc-strip__scroll{display:none}
.lc-strip__scroll:focus-visible{outline:2px solid var(--rk-focus);outline-offset:-3px;box-shadow:none}
.lc-film{position:relative;flex:none;height:66px;width:calc(66px * var(--a));border-radius:5px;background:var(--lc-cell);overflow:hidden}
.lc-film .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.lc-film::after{content:"";position:absolute;inset:0;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);pointer-events:none}
.lc-film:hover::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.lc-film.is-active::after{box-shadow:inset 0 0 0 2px var(--rk-accent),inset 0 0 0 3px rgba(255,255,255,.8)}
.lc-film.is-selected:not(.is-active)::after{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rk-accent) 60%,transparent)}
.lc-film:focus-visible{outline:2px solid var(--rk-focus);outline-offset:2px;box-shadow:none}
.lc-film .b{position:absolute;left:4px;bottom:3px;display:flex;gap:3px;align-items:center;color:#fff;font-size:9.5px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.7))}
.lc-film .b svg{width:9px;height:9px}
.lc-film.is-reject .ph{filter:brightness(.5)}
.lc-film.is-missing .ph{filter:grayscale(.7) brightness(.7)}

/* Final cascade after base filmstrip rules. */
.lc-strip{height:108px}
.lc-strip__ctx{height:34px;padding-inline:14px}

/* ---- Inspector: histogram, sections, sliders ---- */
.lc-histo{margin:0 14px 6px 16px;position:relative;border-radius:8px;overflow:hidden;background:#111214;color:#fff}
:root[data-theme="light"] .lc-histo{background:#2a2a2d}
.lc-histo svg{display:block;width:100%;height:84px}
.lc-histo .clipbtn{position:absolute;top:5px;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:rgba(255,255,255,.55)}
.lc-histo .clipbtn.l{left:5px}.lc-histo .clipbtn.r{right:5px}
.lc-histo .clipbtn:hover{background:rgba(255,255,255,.15);color:#fff}
.lc-histo .clipbtn[aria-pressed="true"]{color:#fff;background:rgba(255,255,255,.22)}
.lc-histo .clipbtn.warn[aria-pressed="true"]{background:var(--lc-reject);color:#fff}
.lc-histo .clipbtn svg{width:9px;height:9px}
.lc-histo .clipbtn:focus-visible{outline:2px solid var(--rk-brand-dark);outline-offset:1px;box-shadow:none}
.lc-histo__foot{display:flex;align-items:center;gap:10px;padding:4px 8px 5px;font-size:10.5px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums}
.lc-histo__foot .grow{flex:1}
.lc-histo__foot .ill{opacity:.55}
.lc-quick{display:flex;align-items:center;gap:6px;padding:6px 14px 8px 16px}
.lc-quick .grow{flex:1}
.lc-rowsel{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 16px;min-height:32px}
.lc-rowsel>.lbl{width:84px;flex:none;color:var(--rk-ink-2);font-size:12px}
.lc-select{appearance:none;flex:1;min-width:0;height:28px;padding:0 24px 0 9px;border:0;border-radius:7px;background:var(--rk-fill-2);color:var(--rk-ink);font:inherit;font-size:12.5px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%23888' stroke-width='1.4' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 8px center}
.lc-select:focus-visible{outline:2px solid var(--rk-focus);outline-offset:1px;box-shadow:none}
.lc-section{border-top:.5px solid var(--rk-hairline)}
.lc-section>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 14px 0 12px;cursor:default;font-weight:600;font-size:13px}
.lc-section>summary::-webkit-details-marker{display:none}
.lc-section>summary:hover{background:var(--rk-fill)}
.lc-section>summary:focus-visible{outline:2px solid var(--rk-focus);outline-offset:-2px;box-shadow:none}
.lc-section>summary .chev{width:14px;height:14px;color:var(--rk-ink-3);transition:transform .12s;flex:none}
.lc-section[open]>summary .chev{transform:rotate(90deg)}
.lc-section>summary .t{flex:1;min-width:0}
.lc-section>summary .mod{width:6px;height:6px;border-radius:50%;background:var(--rk-accent);display:none}
.lc-section.is-mod>summary .mod{display:block}
.lc-section>summary .rst{opacity:0;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--rk-ink-3)}
.lc-section>summary:hover .rst,.lc-section>summary .rst:focus-visible{opacity:1}
.lc-section>summary .rst:hover{background:var(--rk-fill-2);color:var(--rk-ink)}
.lc-section>summary .rst svg{width:13px;height:13px}
.lc-section>summary kbd{font-size:10.5px}
.lc-section__body{padding:2px 0 8px}
.lc-group{padding:6px 16px 2px;font-size:11.5px;font-weight:600;color:var(--rk-ink-2)}
.lc-sub-section{margin:4px 14px 6px 16px;border-radius:9px;background:var(--rk-fill)}
.lc-sub-section>summary{list-style:none;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;font-weight:500;font-size:12.5px}
.lc-sub-section>summary::-webkit-details-marker{display:none}
.lc-sub-section>summary:focus-visible{outline:2px solid var(--rk-focus);outline-offset:-2px;box-shadow:none}
.lc-sub-section>summary .chev{width:13px;height:13px;color:var(--rk-ink-3);margin-left:auto;transition:transform .12s}
.lc-sub-section[open]>summary .chev{transform:rotate(90deg)}
.lc-sub-section>summary svg.ic{width:14px;height:14px;color:var(--rk-ink-2)}
.lc-sub-section .lc-ctl{padding-left:10px;padding-right:10px}
.lc-more{display:flex;align-items:center;gap:8px;margin:6px 14px 4px 16px;height:30px;padding:0 10px;border-radius:8px;color:var(--rk-ink-2);font-size:12.5px;font-weight:500}
.lc-more:hover{background:var(--rk-fill)}
.lc-more svg{width:13px;height:13px}

/* Slider control: label + value on one line, long track below (320px panel) */
.lc-ctl{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"lbl val rst" "sl sl sl";align-items:center;column-gap:6px;padding:3px 14px 2px 16px}
.lc-ctl .lbl{grid-area:lbl;font-size:12.5px;color:var(--rk-ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-ctl.is-mod .lbl{color:var(--rk-ink)}
.lc-ctl .num{grid-area:val;width:62px;height:22px;padding:0 4px;border:0;border-radius:5px;background:transparent;color:var(--rk-ink);text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.lc-ctl .num:hover{background:var(--rk-fill-2)}
.lc-ctl .num:focus{background:var(--rk-elevated);box-shadow:0 0 0 2px var(--rk-focus);outline:none}
.lc-ctl.is-mod .num{color:var(--rk-accent);font-weight:500}
.lc-ctl.is-pending .num{opacity:.6}
.lc-ctl .rst{grid-area:rst;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--rk-ink-3);opacity:0;transition:opacity .1s}
.lc-ctl .rst svg{width:12px;height:12px}
.lc-ctl:hover .rst,.lc-ctl.is-mod .rst,.lc-ctl .rst:focus-visible{opacity:1}
.lc-ctl .rst:hover{background:var(--rk-fill-2);color:var(--rk-ink)}
.lc-ctl .rst:focus-visible{outline:2px solid var(--rk-focus);outline-offset:0;box-shadow:none}
.lc-ctl .track{grid-area:sl;position:relative;height:18px;display:flex;align-items:center}
.lc-ctl .track::before{content:"";position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--trk,var(--rk-fill-3))}
.lc-ctl .track.centered::after{content:"";position:absolute;left:50%;top:3px;width:1px;height:12px;background:var(--rk-ink-3);opacity:.6}
.lc-ctl input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:18px;margin:0;background:transparent;position:relative;z-index:1}
.lc-ctl input[type=range]::-webkit-slider-runnable-track{height:3px;background:transparent}
.lc-ctl input[type=range]::-moz-range-track{height:3px;background:transparent}
.lc-ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.35);margin-top:-5.5px;transition:transform .1s}
.lc-ctl input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.35)}
.lc-ctl input[type=range]:hover::-webkit-slider-thumb,.lc-ctl input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.lc-ctl input[type=range]:focus-visible{outline:none;box-shadow:none}
.lc-ctl input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--rk-plane),0 0 0 4px var(--rk-focus)}
.lc-ctl input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 2px var(--rk-plane),0 0 0 4px var(--rk-focus)}
.lc-ctl input[type=range]:disabled{opacity:.4}
.trk-temp{--trk:linear-gradient(90deg,#3d7cff,#9aa0a6 50%,#ffcc55)}
.trk-tint{--trk:linear-gradient(90deg,#4ccf6a,#9aa0a6 50%,#e056c8)}
.trk-rainbow{--trk:linear-gradient(90deg,#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33)}
.trk-vib{--trk:linear-gradient(90deg,#7a7a7a,#d8406a)}
.trk-sat{--trk:linear-gradient(90deg,#7a7a7a,#e04a3a)}
.trk-vig{--trk:linear-gradient(90deg,#101010,#f0f0f0)}
.trk-lum{--trk:linear-gradient(90deg,#202020,#f0f0f0)}
.lc-curve{margin:4px 14px 8px 16px;border-radius:8px;background:var(--rk-fill);padding:8px}
.lc-curve svg{display:block;width:100%;aspect-ratio:1;border-radius:4px;background:var(--rk-sunk)}
.lc-curve .ch{display:flex;gap:4px;margin-bottom:6px}
.lc-curve .ch button{height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;color:var(--rk-ink-2)}
.lc-curve .ch button[aria-pressed="true"]{background:var(--rk-seg-on);color:var(--rk-ink);box-shadow:var(--rk-knob)}
.lc-mixer{display:flex;gap:6px;padding:6px 14px 4px 16px}
.lc-mixer button{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.lc-mixer button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--rk-plane),0 0 0 3.5px var(--rk-ink)}
.lc-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 14px 8px 16px}
.lc-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;border-radius:9px;background:var(--rk-fill);color:var(--rk-ink-2);font-size:11px}
.lc-tile:hover{background:var(--rk-fill-2);color:var(--rk-ink)}
.lc-tile[aria-pressed="true"]{background:var(--rk-accent-soft);color:var(--rk-accent)}
.lc-tile svg{width:18px;height:18px}
.lc-list{display:flex;flex-direction:column;padding:2px 10px 6px 12px}
.lc-list button.row,.lc-list .row{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 6px 0 8px;border-radius:7px;font-size:12.5px;width:100%}
.lc-list button.row:hover{background:var(--rk-fill)}
.lc-list .row[aria-current="true"],.lc-list .row.is-current{background:var(--rk-accent-soft)}
.lc-list .row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-list .row small{color:var(--rk-ink-3);font-variant-numeric:tabular-nums}
.lc-list .row svg{width:14px;height:14px;color:var(--rk-ink-2);flex:none}
.lc-list .row.is-future{opacity:.5}
.lc-list .row .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--rk-ink-3);opacity:0}
.lc-list .row:hover .x{opacity:1}
.lc-list .row .x:hover{background:var(--rk-fill-2);color:var(--rk-ink)}
.lc-hint{padding:6px 14px 8px 16px;color:var(--rk-ink-2);font-size:12px;text-wrap:pretty}
.lc-preset-group{padding:8px 16px 2px;font-size:11px;font-weight:600;color:var(--rk-ink-3);text-transform:uppercase;letter-spacing:.06em}

/* ---- Overlays: palette, modal, context menu, toasts (RightKit classes) ---- */
.rk-overlay{position:absolute;inset:0;z-index:70;display:flex;justify-content:center;padding:16px;background:var(--rk-scrim);color:var(--rk-ink);font:13px/1.4 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
.rk-overlay--center{align-items:center}
.rk-overlay--top{align-items:flex-start;padding-top:12vh}
.rk-modal,.rk-palette{background:var(--rk-elevated);color:var(--rk-ink);border-radius:14px;box-shadow:var(--rk-pop);max-width:calc(100% - 2rem);outline:none;animation:rk-pop .14s cubic-bezier(.2,.8,.2,1)}
.rk-modal{padding:20px;max-height:calc(100% - 2rem);overflow:auto;width:640px}
.rk-modal__title{margin:0 0 6px;font-size:15px;font-weight:650}
.rk-modal__desc{margin:0 0 14px;color:var(--rk-ink-2);line-height:1.5;text-wrap:pretty}
.rk-modal__actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.rk-modal__actions .grow{flex:1}
@keyframes rk-pop{from{opacity:0;transform:scale(.97) translateY(4px)}}
.rk-palette{width:640px;overflow:hidden}
.rk-palette__field{display:flex;align-items:center;gap:12px;height:54px;padding:0 18px;border-bottom:.5px solid var(--rk-hairline);color:var(--rk-ink-3)}
.rk-palette__field svg{width:18px;height:18px;flex:none}
.rk-palette__field input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--rk-ink);font-size:18px}
.rk-palette__list{max-height:min(56vh,480px);overflow-y:auto;padding:4px 8px 8px}
.rk-palette__group{padding:10px 10px 4px;font-size:11px;font-weight:600;color:var(--rk-ink-3)}
.rk-palette__opt{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;color:var(--rk-ink);width:100%}
.rk-palette__opt.is-active{background:var(--rk-accent-soft)}
.rk-palette__icon{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--rk-fill-2);color:var(--rk-ink-2);flex:none}
.rk-palette__icon svg{width:14px;height:14px}
.rk-palette__label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.rk-palette__empty{padding:14px 12px;color:var(--rk-ink-3)}
.rk-help{width:680px}
.rk-help__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rk-help__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 32px}
.rk-help h3{margin:0 0 8px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.08em;color:var(--rk-ink-3)}
.rk-help ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.rk-help li{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rk-menu-scrim{position:absolute;inset:0;z-index:80}
.rk-menu{position:absolute;z-index:81;background:var(--rk-elevated);color:var(--rk-ink);border-radius:10px;box-shadow:var(--rk-pop);padding:4px;outline:none;animation:rk-pop .1s ease-out;font-size:12.5px;min-width:210px}
.rk-menu__item{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;width:100%}
.rk-menu__item.is-active,.rk-menu__item:focus-visible{background:var(--rk-accent);color:var(--rk-accent-ink);outline:none;box-shadow:none}
.rk-menu__item.is-active .rk-kbd span,.rk-menu__item:focus-visible .rk-kbd span{background:rgba(255,255,255,.2);color:inherit;box-shadow:none}
.rk-menu__item.is-danger{color:var(--rk-bad)}
.rk-menu__item.is-danger.is-active,.rk-menu__item.is-danger:focus-visible{background:var(--rk-bad);color:#fff}
.rk-menu__item.is-disabled{opacity:.4}
.rk-menu__lead{width:14px;flex:none;text-align:center;display:grid;place-items:center}
.rk-menu__lead svg{width:14px;height:14px}
.rk-menu__label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-menu__sep{height:1px;margin:4px 6px;background:var(--rk-hairline)}
.rk-menu__head{padding:6px 8px 2px;font-size:11px;font-weight:600;color:var(--rk-ink-3)}
.rk-toasts{position:absolute;z-index:95;bottom:16px;left:50%;transform:translateX(-50%);width:min(26rem,calc(100% - 2rem));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.rk-toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:38px;max-width:100%;padding:6px 6px 6px 12px;border-radius:99px;background:var(--rk-elevated);color:var(--rk-ink);box-shadow:var(--rk-pop);animation:rk-toast-in .18s cubic-bezier(.2,.8,.2,1)}
.rk-toast.is-leaving{animation:rk-pop-out .15s ease-in forwards}
@keyframes rk-toast-in{from{opacity:0;transform:translateY(8px)}}
@keyframes rk-pop-out{to{opacity:0;transform:scale(.98)}}
.rk-toast__glyph{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;flex:none;font-size:11px;font-weight:800;background:var(--rk-fill-3);color:var(--rk-ink-2)}
.rk-toast--success .rk-toast__glyph{background:var(--rk-ok-soft);color:var(--rk-ok)}
.rk-toast--warning .rk-toast__glyph{background:var(--rk-warn-soft);color:var(--rk-warn)}
.rk-toast--error .rk-toast__glyph{background:var(--rk-bad-soft);color:var(--rk-bad)}
.rk-toast--progress .rk-toast__glyph{background:conic-gradient(var(--rk-accent) var(--p,0%),var(--rk-fill-3) 0)}
.rk-toast__msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rk-toast__action{padding:3px 8px;border-radius:99px;color:var(--rk-accent);font-weight:650}
.rk-toast__action:hover{background:var(--rk-accent-soft)}
.rk-toast__x{width:24px;height:24px;border-radius:50%;color:var(--rk-ink-3);display:grid;place-items:center;flex:none}
.rk-toast__x:hover{background:var(--rk-fill-2);color:var(--rk-ink)}
.rk-toast__x svg{width:10px;height:10px}

/* Import sheet */
.lc-import-src{display:flex;gap:8px;margin-bottom:12px}
.lc-import-scan{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--rk-fill);margin-bottom:10px}
.lc-import-scan .bar{flex:1;height:4px;border-radius:2px;background:var(--rk-fill-3);overflow:hidden;position:relative}
.lc-import-scan .bar i{position:absolute;inset:0 auto 0 0;width:35%;border-radius:2px;background:var(--rk-accent);animation:lc-indet 1.1s ease-in-out infinite}
.lc-import-scan .bar.det i{animation:none;width:var(--p,0%);transition:width .2s}
@keyframes lc-indet{0%{left:-35%}100%{left:100%}}
.lc-import-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.lc-cands{border-radius:10px;background:var(--rk-sunk);max-height:300px;overflow:auto;padding:4px}
.lc-cand{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px}
.lc-cand:hover{background:var(--rk-fill)}
.lc-cand input{accent-color:var(--rk-accent)}
.lc-cand .th{width:44px;height:30px;border-radius:4px;background:var(--rk-fill-3);flex:none;background-size:cover;background-position:center}
.lc-cand .c{flex:1;min-width:0}
.lc-cand .c strong{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-cand .c small{display:block;color:var(--rk-ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-cand.is-dup{opacity:.55}
.lc-form{display:flex;flex-direction:column;gap:10px}
.rk-field{display:flex;flex-direction:column;gap:5px}
.rk-field label{font-size:12.5px;font-weight:600}
.rk-field small{color:var(--rk-ink-3);font-size:12px}
.lc-switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px}
.lc-note{font-size:12px;color:var(--rk-ink-2);text-wrap:pretty}
.lc-note--bad{color:var(--rk-bad)}

/* ---- Narrow / responsive safety ---- */
@media (max-width:1100px){
  .lc-filterbar .rk-search{width:170px}
  .lc-thumbsize{display:none}
}
/* Reduced motion: no transitions, no shimmer, no spinners */
@media (prefers-reduced-motion:reduce){
  .rk-shell *,.rk-overlay,.rk-modal,.rk-palette,.rk-menu,.rk-toast{animation:none!important;transition:none!important}
  .lc-strip__scroll{scroll-behavior:auto}
}
:root[data-motion="reduce"] .rk-shell *,:root[data-motion="reduce"] .rk-overlay,:root[data-motion="reduce"] .rk-modal,:root[data-motion="reduce"] .rk-palette,:root[data-motion="reduce"] .rk-menu,:root[data-motion="reduce"] .rk-toast{animation:none!important;transition:none!important}
:root[data-motion="reduce"] .lc-strip__scroll{scroll-behavior:auto}
</style>

<body>

      <span id="title-status"></span>
      <button class="rk-btn rk-btn--secondary" id="btn-import"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M5 7l3 3 3-3"/><path d="M3 11v2a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2"/></svg>Import…</button>
      <button class="rk-btn rk-btn--secondary" id="btn-export"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2M5 5l3-3 3 3"/><path d="M3 11v2a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2"/></svg>Export…</button>
    </div>
    <div class="rk-caption" aria-hidden="true">
      <button class="rk-caption__btn" tabindex="-1"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg></button>
      <button class="rk-caption__btn" tabindex="-1"><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
      <button class="rk-caption__btn rk-caption__close" tabindex="-1"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M.5 .5 9.5 9.5M9.5 .5 .5 9.5" stroke="currentColor"/></svg></button>
    </div>
  </header>

  <div class="rk-body">
    <!-- Sidebar: sources. Collapses to a 48px rail that keeps the active row fused. -->

      <div class="rk-side__foot">
        <div class="rk-status" id="side-status" aria-live="polite"></div>
        <footer class="rk-brand-foot">

        </footer>
      </div>
    </aside>

    <!-- Plane: the photo workspace -->

      <div class="lc-work">

                <div class="rk-seg rk-seg--icons" role="radiogroup" aria-label="Grid style">

                  <button class="rk-seg__item" role="radio" aria-checked="false" data-grid="square" title="Square grid"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></button>
                </div>

              </div>
            </header>
            <div class="lc-filterbar" role="group" aria-label="Find photos">
              <label class="rk-search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="search" type="search" placeholder="Search photos" aria-label="Search photos"></label>
              <span class="sep"></span>
              <button class="lc-chip" data-filter="rating" aria-pressed="false"><svg viewBox="0 0 16 16" fill="currentColor"><path d="m8 1.5 2 4.3 4.6.5-3.4 3.2.9 4.6L8 11.8 3.9 14.1l.9-4.6L1.4 6.3 6 5.8z"/></svg>3+ stars</button>
              <button class="lc-chip" data-filter="pick" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14V2.5h8l-2 3.5 2 3.5H4"/></svg>Picks</button>
              <button class="lc-chip" data-filter="edited" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 13h10M3 10h6M3 7h10"/></svg>Edited</button>
              <button class="lc-chip" id="btn-filters" aria-expanded="false">Filters <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m4 6 4 4 4-4"/></svg></button>

            <div class="lc-grid-wrap">

                  <button class="rk-seg__item" role="radio" aria-checked="false" data-mode="survey" title="Survey (N)"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="3" width="4" height="10" rx="1"/><rect x="6.5" y="3" width="4" height="10" rx="1"/><rect x="11.5" y="3" width="3" height="10" rx="1"/></svg></button>
                  <button class="rk-seg__item" role="radio" aria-checked="false" data-mode="reference" title="Reference (R)"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="3" width="6" height="10" rx="1"/><rect x="8.5" y="3" width="6" height="10" rx="1"/><path d="M4.5 6v4M3 8h3" stroke-width="1.2"/></svg></button>

                <span class="sep"></span>

              </div>
              <div class="lc-strip__scroll" id="film" role="listbox" aria-label="Photos in this source" tabindex="0"></div>
            </div>
          </div>

        <!-- Inspector (right panel). Shared by both views. -->

          <div class="lc-inspector__grip" id="grip" role="slider" aria-label="Resize inspector" aria-orientation="vertical" aria-valuemin="260" aria-valuemax="520" aria-valuenow="320" tabindex="0"></div>
          <div class="lc-inspector__scroll" id="inspector-scroll"></div>
        </aside>
      </div>
      <div class="rk-toasts" id="toasts" role="status" aria-live="polite"></div>
    </section>

    <!-- Right tool rail (chrome surface). One place for tools; the active one fuses into the inspector. -->
    <nav class="lc-rail" id="rail" aria-label="Tools"></nav>
  </div>
</div>
<div id="overlay-root"></div>
</div>

function photosIn(src){
  switch(src.kind){
    case 'all':return PHOTOS.filter(p=>!p.deleted);
    case 'recent':return PHOTOS.filter(p=>!p.deleted).sort((a,b)=>b.imported.localeCompare(a.imported)).slice(0,6);
    case 'picks':return PHOTOS.filter(p=>!p.deleted&&p.flag==='pick');
    case 'deleted':return PHOTOS.filter(p=>p.deleted);
    case 'album':return PHOTOS.filter(p=>!p.deleted&&p.albums.includes(src.id));
    case 'date':return PHOTOS.filter(p=>!p.deleted);
    case 'missing':return PHOTOS.filter(p=>!p.deleted&&p.missing);
    default:return PHOTOS.filter(p=>!p.deleted);
  }
}
function sourceLabel(src){return src.kind==='all'?'All Photos':src.kind==='recent'?'Recently Added':src.kind==='picks'?'Picks':src.kind==='deleted'?'Recently Deleted':src.kind==='album'?(ALBUMS.find(a=>a.id===src.id)||{}).name:src.kind==='date'?'By Date':src.kind==='missing'?'Missing Photos':'Photos';}
function sourceIcon(src){return src.kind==='all'?'library':src.kind==='recent'?'clock':src.kind==='picks'?'flag':src.kind==='deleted'?'trash':src.kind==='album'?'album':src.kind==='date'?'calendar':'warning';}
function sourceId(src){return src.kind==='album'?'album:'+src.id:src.kind;}
function visible(){
  let list=photosIn(S.source);
  const f=S.filter,q=f.text.trim().toLowerCase();
  if(q)list=list.filter(p=>(p.name+' '+p.file+' '+p.loc+' '+p.kw.join(' ')).toLowerCase().includes(q));
  if(f.rating)list=list.filter(p=>p.rating>=3);
  if(f.pick)list=list.filter(p=>p.flag==='pick');
  if(f.edited)list=list.filter(p=>p.edited||edit(p.id).history.length>1);
  const k=S.sort;list=list.slice().sort((a,b)=>{let r=0;if(k==='capture')r=a.date.localeCompare(b.date);else if(k==='import')r=a.imported.localeCompare(b.imported);else if(k==='name')r=a.file.localeCompare(b.file);else if(k==='rating')r=a.rating-b.rating;else r=(a.w*a.h)-(b.w*b.h);return S.asc?r:-r;});
  if(S.source.kind==='recent')list=photosIn(S.source);
  return list;
}

function cellHTML(p){

const imgCache={};
function loadSource(key,cb){if(imgCache[key]&&imgCache[key].complete&&imgCache[key].naturalWidth){cb(imgCache[key]);return;}const im=imgCache[key]||(imgCache[key]=new Image());im.addEventListener('load',()=>cb(im),{once:true});im.addEventListener('error',()=>cb(null),{once:true});if(!im.src)im.src=ROOT+SRC[key].f;}
function styleFor(id){
  const e=edit(id),v=c=>val(id,c);
  const ex=v('light.exposure'),co=v('light.contrast'),hi=v('light.highlights'),sh=v('light.shadows'),wh=v('light.whites'),bl=v('light.blacks'),sat=v('color.saturation'),vib=v('color.vibrance'),cl=v('effects.clarity'),dh=v('effects.dehaze');
  const bright=Math.pow(2,ex*.55)*(1+wh/600-bl/900+sh/800-hi/900);
  const contrast=1+co/220+cl/400+dh/350-bl/1000;
  const saturate=e.bw?0:1+sat/100+vib/220;
  const f=`brightness(${bright.toFixed(3)}) contrast(${contrast.toFixed(3)}) saturate(${Math.max(0,saturate).toFixed(3)})`;
  const t=(v('wb.temp')-6500)/8000,ti=v('wb.tint')/150;
  const tint=e.bw?'transparent':`rgba(${t>0?255:60},${t>0?170:120},${t>0?60:255},${Math.min(.6,Math.abs(t)*.9).toFixed(2)})`;
  const tint2=`rgba(${ti>0?230:90},${ti>0?80:220},${ti>0?220:110},${Math.min(.5,Math.abs(ti)*.6).toFixed(2)})`;

  return {f,tint:`linear-gradient(${tint},${tint}),linear-gradient(${tint2},${tint2})`,vig,vigMid:`${100-v('vignette.midpoint')*.6}%`,grain:(v('grain.amount')/100*.6).toFixed(2)};
}
let fitW=0,fitH=0;

/* histogram: measured from the decoded preview when the browser allows it; otherwise an honest "illustrative" curve */
let histo={bins:null,n:0,illustrative:true};
function computeHistogram(){
  const p=byId(S.active);if(!p)return;const src=p.full||p.thumb;
  loadSource(src.src,im=>{
    if(!im){histo={bins:null,n:0,illustrative:true};renderHistogram();return;}
    try{const w=192,h=Math.max(1,Math.round(192*src.h/src.w));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,src.x,src.y,src.w,src.h,0,0,w,h);const d=x.getImageData(0,0,w,h).data;const r=new Uint32Array(64),g=new Uint32Array(64),b=new Uint32Array(64),l=new Uint32Array(64);
      const st=styleFor(p.id);const br=S.before?1:parseFloat(st.f.match(/brightness\(([\d.]+)/)[1]);
      const cc=document.createElement('canvas');cc.width=w;cc.height=h;const cx=cc.getContext('2d');const out=cx.createImageData(w,h),o=out.data;
      for(let i=0;i<d.length;i+=4){const R=Math.min(255,d[i]*br),G=Math.min(255,d[i+1]*br),B=Math.min(255,d[i+2]*br);r[R>>2]++;g[G>>2]++;b[B>>2]++;l[(0.2126*R+0.7152*G+0.0722*B)>>2]++;
        if(R>=250||G>=250||B>=250){o[i]=255;o[i+1]=40;o[i+2]=40;o[i+3]=230;}else if(R<=4&&G<=4&&B<=4){o[i]=60;o[i+1]=120;o[i+2]=255;o[i+3]=230;}}
      cx.putImageData(out,0,0);
      histo={bins:{r,g,b,l},n:w*h,illustrative:false,clipHi:(r[63]+g[63]+b[63])/(3*w*h),clipLo:(r[0]+g[0]+b[0])/(3*w*h),clipUrl:cc.toDataURL()};
    }catch(err){histo={bins:null,n:0,illustrative:true};}
    renderHistogram();renderClipMask();
  });
}
function renderClipMask(){const el=$('#stage-wrap .clip');if(!histo.bins||!histo.clipUrl){el.classList.remove('has-data');el.style.backgroundImage='';return;}el.style.backgroundImage=`url("${histo.clipUrl}")`;el.classList.add('has-data');}
function histogramSVG(){

    paths=`<path d="${path(l)} L${W} ${H} L0 ${H}Z" fill="rgba(255,255,255,.22)"/><path d="${path(r)}" stroke="#ff5f5f" fill="rgba(255,95,95,.18)"/><path d="${path(g)}" stroke="#5bd27a" fill="rgba(91,210,122,.16)"/><path d="${path(b)}" stroke="#5ea0ff" fill="rgba(94,160,255,.18)"/>`;}
  else{paths=`<path d="M0 84 C 40 20, 90 60, 128 40 S 220 70, 256 84 Z" fill="rgba(255,255,255,.18)"/><path d="M0 84 C 40 20, 90 60, 128 40 S 220 70, 256 84" stroke="rgba(255,255,255,.5)" stroke-dasharray="3 3" fill="none"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${histo.bins?'RGB and luminance histogram':'Illustrative histogram placeholder'}" style="mix-blend-mode:screen"><g fill="none" stroke-width="1" vector-effect="non-scaling-stroke">${paths}</g><path d="M64 0v84M128 0v84M192 0v84" stroke="rgba(255,255,255,.08)"/></svg>`;
}

let gesture=null,endTimer=null,saveTimer=null;

  const row=$(`.lc-ctl[data-ctl="${c}"]`);if(row){row.classList.toggle('is-mod',isMod(id,c));const n=$('.num',row);if(document.activeElement!==n)n.value=fmt(spec,v);const r=$('input[type=range]',row);if(r.value!=String(v))r.value=v;r.setAttribute('aria-valuetext',fmt(spec,v));const sec=row.closest('.lc-section');if(sec)sec.classList.toggle('is-mod',CONTROLS.some(x=>x.sec===sec.dataset.sec&&isMod(id,x.id)));}
  if(c==='crop.angle')$('#crop').style.transform=`rotate(${v}deg)`;
  if(S.view==='develop')renderStage();

}
function beginGesture(id,c){if(gesture&&gesture.c===c)return;if(gesture)endGesture(gesture.id,gesture.c);gesture={id,c,before:val(id,c)};}
function endGesture(id,c){clearTimeout(endTimer);if(!gesture||gesture.c!==c)return;const after=val(id,c);const g=gesture;gesture=null;if(Math.abs(after-g.before)<1e-9)return;pushHistory(id,`${CTL[c].label} ${fmt(CTL[c],after)}`);}

  const row=$(`.lc-cell[data-id="${id}"] .top`);if(row&&!$('.lc-mark--edited',row))row.insertAdjacentHTML('beforeend',`<span class="lc-mark lc-mark--edited" title="Edited">${svg('sliders','')}</span>`);

    ${phase==='error'?`<p class="lc-note lc-note--bad" role="alert">Couldn’t read the card: it was ejected while reviewing. Reconnect it and choose it again.</p>`:''}
    <div class="lc-import-layout"><div><div class="lc-sub" style="margin:0 0 6px">Review ${cands.length?`· ${cands.length} found, ${cands.filter(c=>c.dup).length} already in library`:''}</div><div class="lc-cands">${cands.length?cands.map((c,i)=>`<label class="lc-cand${c.dup?' is-dup':''}"><input type="checkbox" ${checked[i]?'checked':''} ${c.dup?'disabled':''} data-ck="${i}" aria-label="${esc(c.file)}"><span class="th" data-art-c="${i}"></span><span class="c"><strong>${esc(c.file)}</strong><small>${c.dup?'Already in library (same content)':esc(c.path)}</small></span></label>`).join(''):`<p class="lc-note" style="padding:14px">Nothing to review yet. ${phase==='idle'?'Pick a source above.':''}</p>`}</div></div>

    acts.innerHTML=`<span class="lc-note grow">${phase==='ready'?`${n} photo${n===1?'':'s'} will be added · duplicates are skipped`:phase==='submitting'?'Starting import…':''}</span><button class="rk-btn rk-btn--secondary" data-close>Cancel</button><button class="rk-btn rk-btn--primary" data-go ${phase!=='ready'||!n?'disabled':''}>${phase==='submitting'?'Importing…':`Import${n?' '+n:''}`}</button>`;
    $$('[data-art-c]',body).forEach(el=>{const c=cands[+el.dataset.artC];art(el,c.thumb);});};
  m.addEventListener('click',e=>{const s=e.target.closest('[data-src]');if(s){source=s.dataset.src==='card'?'CARD_A':s.dataset.src==='folder'?'~/Pictures/2026-09 Trip':'4 files';phase='choosing';cands=[];checked=[];render();setTimeout(()=>{if(phase!=='choosing')return;phase='scanning';render();setTimeout(()=>{if(phase!=='scanning')return;cands=[...IMPORTABLE.map(p=>({...p,dup:false})),...dupIds.map(id=>({...byId(id),dup:true,path:'/Volumes/CARD_A/'+byId(id).file}))];checked=cands.map(c=>!c.dup);phase='ready';render();},1400);},500);}

function startImportJob(list){
  const total=list.length;S.importJob={done:0,total,list};
  list.forEach((c,i)=>{PHOTOS.push({...c,imported:'2026-10-08',pending:true,albums:[]});});
  renderNav();renderLibraryHead();renderGrid();renderStatus();
  const t=toast(`Importing ${total} photos…`,'progress',0,{label:'Cancel',run:cancelImport});
  const tick=()=>{if(!S.importJob)return;const j=S.importJob;j.done++;const ph=byId(j.list[j.done-1].id);ph.pending=false;$('.rk-toast__glyph',t).style.setProperty('--p',(j.done/j.total*100)+'%');$('.rk-toast__msg',t).textContent=`Importing ${j.done} of ${j.total}…`;renderGrid();renderStatus();renderNav();
    if(j.done>=j.total){S.importJob=null;t.close();renderStatus();renderLibraryHead();if(S.view==='develop')renderStrip();toast(`${total} photos added · 4 duplicates skipped`,'success',6000,{label:'Show',run:()=>{navigate('recent');}});}else setTimeout(tick,1100);};
  setTimeout(tick,1300);
}
function cancelImport(){if(!S.importJob)return;const j=S.importJob;S.importJob=null;PHOTOS=PHOTOS.filter(p=>!p.pending);renderNav();renderGrid();renderStatus();renderLibraryHead();toast(`Import cancelled · ${j.done} of ${j.total} added`,'warning');}
