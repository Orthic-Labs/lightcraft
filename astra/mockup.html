document.addEventListener('dblclick',e=>{const cell=e.target.closest('.lc-cell[data-id]');if(cell){e.preventDefault();select(+cell.dataset.id);setView('develop');}});
document.addEventListener('contextmenu',e=>{const cell=e.target.closest('.lc-cell[data-id],.lc-film[data-id]');if(!cell)return;e.preventDefault();const id=+cell.dataset.id;if(!S.selection.has(id))select(id);const p=byId(id);const n=S.selection.size;
  menu({x:e.clientX,y:e.clientY,label:'Photo',anchor:cell,items:[{head:n>1?`${n} photos`:p.file},{label:'Pick',icon:'pick',kbd:'P',run:()=>flag('pick')},{label:'Reject',icon:'reject',kbd:'X',run:()=>flag('reject')},{label:'Unflag',kbd:'U',run:()=>flag('none')},'-',{custom:`<div class="rk-menu__head">Rating</div><div style="display:flex;gap:2px;padding:0 6px 4px">${[1,2,3,4,5].map(i=>`<button class="rk-menu__item" style="width:30px;justify-content:center;padding:0" data-rate="${i}" aria-label="${i} stars" aria-pressed="${p.rating===i}"><svg viewBox="0 0 16 16" width="14" height="14" fill="${i<=p.rating?'var(--lc-star)':'none'}" stroke="currentColor" stroke-width="1.3">${I.star}</svg></button>`).join('')}</div>`},'-',{label:'Edit in Develop',icon:'edit',kbd:'↩',run:()=>setView('develop')},{label:'Copy edit settings',kbd:'⇧⌘C',run:()=>toast('Edit settings copied')},{label:'Paste edit settings',kbd:'⇧⌘V',run:()=>toast(`Settings pasted to ${n} photo${n>1?'s':''}`,'success')},'-',{head:'Add to album'},...ALBUMS.slice(0,4).map(a=>({label:a.name,icon:'album',run:()=>{[...S.selection].forEach(i=>{const q=byId(i);if(!q.albums.includes(a.id))q.albums.push(a.id);});renderNav();toast(`Added to ${a.name}`,'success');}})),'-',{label:'Reveal original',icon:'external',run:()=>toast('Reveals the file in the native file manager')},{label:'Move to Recently Deleted',icon:'trash',kbd:'⌫',danger:true,run:()=>{[...S.selection].forEach(i=>byId(i).deleted=true);navigate(sourceId(S.source));toast(`${n} photo${n>1?'s':''} moved to Recently Deleted`,'',5000,{label:'Undo',run:()=>{PHOTOS.forEach(q=>q.deleted=false);navigate(sourceId(S.source));}});}}]});});
function afterFilter(){renderLibraryHead();renderGrid();if(S.view==='develop')renderStrip();renderStripCtx();const list=visible();if(S.active&&!list.some(p=>p.id===S.active)&&list.length){/* keep the active photo even when filtered out: never lose edit context */}}
let searchT;$('#search').addEventListener('input',e=>{clearTimeout(searchT);searchT=setTimeout(()=>{S.filter.text=e.target.value;afterFilter();},180);});
$('#thumb-size').addEventListener('input',e=>{S.thumb=+e.target.value;renderGrid();});
$('#zoom').addEventListener('change',e=>{S.zoom=e.target.value;S.pan={x:0,y:0};renderStage();});
$('#inspector-scroll').addEventListener('input',e=>{const r=e.target.closest('[data-range]');if(r){const c=r.dataset.range;beginGesture(S.active,c);setValue(S.active,c,+r.value,false);clearTimeout(endTimer);endTimer=setTimeout(()=>endGesture(S.active,c),400);}});
$('#inspector-scroll').addEventListener('change',e=>{const r=e.target.closest('[data-range]');if(r){endGesture(S.active,r.dataset.range);}const n=e.target.closest('[data-num]');if(n){const c=n.dataset.num;const v=parseFloat(n.value.replace(/[^\d.\-+]/g,''));if(Number.isFinite(v)){beginGesture(S.active,c);setValue(S.active,c,v,true);}else n.value=fmt(CTL[c],val(S.active,c));}
  const kw=e.target.closest('[data-kw-input]');if(kw&&kw.value.trim()){[...S.selection].forEach(id=>{const p=byId(id);if(!p.kw.includes(kw.value.trim()))p.kw.push(kw.value.trim());});renderInspector();$('[data-kw-input]')?.focus();}
  const wb=e.target.closest('[data-wb]');if(wb){const presets={'As shot':[6500,0],'Auto':[6100,4],'Daylight':[5500,10],'Cloudy':[6500,10],'Shade':[7500,10],'Tungsten':[2850,0]};const v=presets[wb.value];if(v){beginGesture(S.active,'wb.temp');setValue(S.active,'wb.temp',v[0],false);setValue(S.active,'wb.tint',v[1],false);gesture=null;pushHistory(S.active,`White balance: ${wb.value}`);renderInspector();}}});
$('#inspector-scroll').addEventListener('dblclick',e=>{const r=e.target.closest('[data-range]');if(r){const c=r.dataset.range;beginGesture(S.active,c);setValue(S.active,c,CTL[c].def,true);}});
$('#inspector-scroll').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sec)sections[d.dataset.sec]=d.open;},true);
$('#inspector-scroll').addEventListener('keydown',e=>{const n=e.target.closest('[data-num]');if(n&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();const c=n.dataset.num;const step=CTL[c].step*(e.shiftKey?10:1);beginGesture(S.active,c);setValue(S.active,c,val(S.active,c)+(e.key==='ArrowUp'?step:-step),false);n.value=fmt(CTL[c],val(S.active,c));clearTimeout(endTimer);endTimer=setTimeout(()=>endGesture(S.active,c),400);}if(n&&e.key==='Enter'){n.blur();}if(n&&e.key==='Escape'){n.value=fmt(CTL[n.dataset.num],val(S.active,n.dataset.num));n.blur();}});
function applyAspect(){const p=byId(S.active),e=edit(S.active);const a=S.cropAspect;let r=null;if(a==='original')r=p.w/p.h;else if(a!=='free'){const [x,y]=a.split(':').map(Number);r=x/y;}
  if(r){const pa=p.w/p.h;let w=1,h=1;if(r>pa)h=pa/r;else w=r/pa;e.crop={x:(1-w)/2,y:(1-h)/2,w,h};}pushHistory(S.active,`Crop ${a}`);renderInspector();renderStage();}
function applyPreset(name){const pr=PRESETS.flatMap(g=>g[1]).find(x=>x[0]===name);if(!pr)return;const e=edit(S.active);e.values={};e.bw=false;Object.entries(pr[1]).forEach(([k,v])=>{if(k==='bw')e.bw=true;else e.values[k]=v;});pushHistory(S.active,`Preset: ${name}`);e.preset=name;renderInspector();renderStage();}
/* crop handle drag */
(()=>{let d=null;$('#crop').addEventListener('pointerdown',e=>{const h=e.target.closest('.hd');if(!h)return;e.stopPropagation();const r=$('#photo').getBoundingClientRect();const e2=edit(S.active);d={h:h.dataset.h,r,c:{...e2.crop}};h.setPointerCapture(e.pointerId);});
  $('#crop').addEventListener('pointermove',e=>{if(!d)return;const x=clamp((e.clientX-d.r.left)/d.r.width,0,1),y=clamp((e.clientY-d.r.top)/d.r.height,0,1);const c={...d.c};const x1=c.x+c.w,y1=c.y+c.h;
    if(d.h.includes('w'))c.x=Math.min(x,x1-.05);if(d.h.includes('n'))c.y=Math.min(y,y1-.05);c.w=(d.h.includes('e')?Math.max(x,c.x+.05):x1)-c.x;c.h=(d.h.includes('s')?Math.max(y,c.y+.05):y1)-c.y;edit(S.active).crop=c;S.cropAspect='free';renderStage();});
  $('#crop').addEventListener('pointerup',()=>{if(d){pushHistory(S.active,'Crop');renderInspector();}d=null;});})();
/* inspector resize */
(()=>{const g=$('#grip');let d=null;g.addEventListener('pointerdown',e=>{d={x:e.clientX,w:S.inspectorW};g.classList.add('is-dragging');g.setPointerCapture(e.pointerId);});g.addEventListener('pointermove',e=>{if(!d)return;S.inspectorW=clamp(d.w-(e.clientX-d.x),260,520);applyShell();});g.addEventListener('pointerup',()=>{d=null;g.classList.remove('is-dragging');if(S.view==='library')renderGrid();else renderStage();});g.addEventListener('dblclick',()=>{S.inspectorW=292;applyShell();if(S.view==='library')renderGrid();else renderStage();});
  g.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();S.inspectorW=clamp(S.inspectorW+(e.key==='ArrowLeft'?16:-16),260,520);applyShell();if(S.view==='library')renderGrid();else renderStage();}});})();
/* sidebar roving focus */
$('#nav').addEventListener('keydown',e=>{const items=$$('[data-nav-id]',$('#nav'));const i=items.indexOf(document.activeElement);if(i<0)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[clamp(i+(e.key==='ArrowDown'?1:-1),0,items.length-1)].focus();}if(e.key==='Home'){e.preventDefault();items[0].focus();}if(e.key==='End'){e.preventDefault();items[items.length-1].focus();}});
/* grid / filmstrip keyboard */
$('#grid').addEventListener('keydown',e=>{const list=gridList;if(!list.length)return;const i=list.findIndex(p=>p.id===S.active);const cols=S.gridMode==='square'?Math.max(1,Math.floor(($('#grid').clientWidth-32+8)/(S.thumb+8))):(()=>{const row=$(`.lc-cell[data-id="${S.active}"]`)?.closest('.lc-row');return row?row.children.length:4;})();
  const go=n=>{e.preventDefault();const id=list[clamp(n,0,list.length-1)].id;select(id,e.shiftKey?'range':'replace');focusActiveItem();};
  if(e.key==='ArrowRight')go(i+1);else if(e.key==='ArrowLeft')go(i-1);else if(e.key==='ArrowDown')go(i+cols);else if(e.key==='ArrowUp')go(i-cols);else if(e.key==='Home')go(0);else if(e.key==='End')go(list.length-1);else if(e.key==='Enter'){e.preventDefault();setView('develop');}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'){e.preventDefault();list.forEach(p=>S.selection.add(p.id));syncSelectionClasses();renderInspector();}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();const n=S.selection.size;[...S.selection].forEach(id=>byId(id).deleted=true);navigate(sourceId(S.source));toast(`${n} photo${n>1?'s':''} moved to Recently Deleted`,'',5000,{label:'Undo',run:()=>{PHOTOS.forEach(q=>q.deleted=false);navigate(sourceId(S.source));}});}});
$('#film').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();stepActive(1);}else if(e.key==='ArrowLeft'){e.preventDefault();stepActive(-1);}else if(e.key==='Home'){e.preventDefault();stepActive(-999);}else if(e.key==='End'){e.preventDefault();stepActive(999);}});
/* global shortcuts */
document.addEventListener('keydown',e=>{
  if(modalState||openMenu||$('.rk-palette'))return;
  const tgt=(e.target&&e.target.closest)?e.target:document.body;const typing=(tgt.tagName==='INPUT'&&tgt.type!=='range')||tgt.tagName==='TEXTAREA'||tgt.tagName==='SELECT'||tgt.isContentEditable;
  const onRange=tgt.tagName==='INPUT'&&tgt.type==='range';
  const mod=e.metaKey||e.ctrlKey;const k=e.key;const ap=byId(S.active);
  if(mod&&k.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
  if(mod&&k==='\\'){e.preventDefault();toggleSidebar();return;}
  if(mod&&k===']'){e.preventDefault();toggleInspector();return;}
  if(mod&&k.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
  if(mod&&k.toLowerCase()==='i'){e.preventDefault();openImport();return;}
  if(mod&&e.shiftKey&&k.toLowerCase()==='e'){e.preventDefault();openExport();return;}
  if(mod&&k==='0'&&S.view==='develop'){e.preventDefault();S.zoom='fit';$('#zoom').value='fit';renderStage();return;}
  if(mod&&k==='1'&&S.view==='develop'){e.preventDefault();S.zoom='1';$('#zoom').value='1';renderStage();return;}
  if(mod&&['2','3','4'].includes(k)&&S.view==='develop'){e.preventDefault();const sec=['Color','Effects','Detail'][+k-2];sections[sec]=!sections[sec];renderInspector();return;}
  if(typing||mod)return;
  if(k==='?'){e.preventDefault();openHelp();return;}
  if(k==='Escape'){if(S.view==='develop'&&curPanel()!=='edit'){setPanel('edit');}return;}
  const lk=k.toLowerCase();
  if(lk==='g'){setView('library');return;}if(lk==='d'){setView('develop');return;}
  if(!ap)return;
  if(/^[0-5]$/.test(k)){rate(+k);return;}
  if(lk==='p'&&!e.shiftKey){flag(ap.flag==='pick'?'none':'pick');return;}if(lk==='x'){flag(ap.flag==='reject'?'none':'reject');return;}if(lk==='u'){flag('none');return;}
  if(lk==='p'&&e.shiftKey){setPanel('presets');return;}
  if(lk==='e'){setPanel('edit');return;}if(lk==='c'){setPanel('crop');return;}if(lk==='h'){setPanel('remove');return;}if(lk==='m'){setPanel('mask');return;}if(lk==='i'){setPanel('info');return;}if(lk==='k'){setPanel('keywords');return;}
  if(S.view==='develop'){if(lk==='y'){toggleBefore();return;}if(lk==='j'){$('#btn-clip').click();return;}if(lk==='f'){toggleFilmstrip();return;}if(lk==='o'){S.maskOverlay=!S.maskOverlay;renderStage();renderInspector();return;}
    if(k==='ArrowRight'&&!onRange&&!tgt.closest('#film,#inspector,#grip')){e.preventDefault();stepActive(1);return;}if(k==='ArrowLeft'&&!onRange&&!tgt.closest('#film,#inspector,#grip')){e.preventDefault();stepActive(-1);return;}}
  if(S.view==='library'&&k==='Enter'&&!tgt.closest('#grid')){setView('develop');}
});
/* harness */
$('#harness').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.frame){setFrame(b.dataset.frame);}
  if(b.dataset.theme){setTheme(b.dataset.theme);}
  if(b.dataset.platform){document.documentElement.dataset.platform=b.dataset.platform;$('#app').dataset.platform=b.dataset.platform;$$('#harness [data-platform]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}
  if(b.dataset.sim==='import')openImport();if(b.dataset.sim==='error'){S.readError=true;renderLibraryHead();renderStatus();toast('Couldn’t read LC01235.JPG while building previews','error',6000,{label:'Retry',run:()=>{S.readError=false;renderLibraryHead();renderStatus();}});}
  if(b.dataset.sim==='reset')location.href=location.pathname;});
function setFrame(f){const r=document.documentElement;if(f==='1600')f='1600x1000';if(f==='1280')f='1280x800';$$('#harness [data-frame]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.frame===f)));if(f==='fill'){r.dataset.frame='fill';}else{const [w,h]=f.split('x');if(!w||!h){r.dataset.frame='fill';return;}r.dataset.frame='fixed';r.style.setProperty('--frame-w',w+'px');r.style.setProperty('--frame-h',h+'px');}requestAnimationFrame(()=>{if(S.view==='library')renderGrid();else renderStage();});}
new ResizeObserver(()=>{if(S.view==='library')renderGrid();else renderStage();}).observe($('#main'));

/* ---------------- Boot from URL ---------------- */
(function boot(){
  const theme=url.get('theme');if(theme==='light'||theme==='dark')setTheme(theme);else setTheme('dark');
  if(url.get('platform')==='windows'){document.documentElement.dataset.platform='windows';$('#app').dataset.platform='windows';$$('#harness [data-platform]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.platform==='windows')));}
  if(url.get('motion')==='reduce')document.documentElement.dataset.motion='reduce';
  if(url.get('harness')==='0')$('#harness').hidden=true;
  if(url.get('frame'))setFrame(url.get('frame'));
  if(url.get('source'))S.source=url.get('source').startsWith('album:')?{kind:'album',id:url.get('source').slice(6)}:{kind:url.get('source')};
  if(url.get('names')==='1')S.showNames=true;
  if(S.view==='library'&&EDIT_TOOLS.includes(S.panel.library))S.panel.library='info';
  renderNav();renderRail();applyShell();renderLibraryHead();renderGrid();renderInspector();
  if(S.view==='develop'){renderStrip();renderStage();computeHistogram();}
  if(url.get('modal')==='import')setTimeout(openImport,50);if(url.get('modal')==='export')setTimeout(openExport,50);if(url.get('modal')==='help')setTimeout(openHelp,50);
  if(url.get('error')==='1'){S.readError=true;renderLibraryHead();renderStatus();}
})();
})();
</script>
